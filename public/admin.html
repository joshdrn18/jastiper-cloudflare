<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — JASTIPER</title><link rel="stylesheet" href="/styles.css"></head><body class="admin-body"><header class="top"><a class="brand" href="/">JASTIPER<span>.</span></a><a href="/" class="muted">← Kembali ke toko</a></header><main class="admin-main"><section id="login-panel" class="panel login-panel"><p class="eyebrow">PRIVATE WORKSPACE</p><h1>Admin login.</h1><p class="muted">Masuk untuk mengelola katalog dan pesanan.</p><form id="login-form"><label>Password admin<input type="password" name="password" required autocomplete="current-password"></label><button class="button dark full">Masuk</button><div id="login-error" aria-live="polite"></div></form></section>
<section id="dashboard" hidden><div class="admin-title"><div><p class="eyebrow">JASTIPER / CONTROL</p><h1>Dashboard.</h1></div><button id="logout" class="button outline">Keluar</button></div><div class="tabs"><button data-tab="products" class="tab active">Produk</button><button data-tab="orders" class="tab">Pesanan</button><button data-tab="settings" class="tab">Pengaturan</button></div>
<section id="tab-products" class="panel"><div class="panel-title"><h2>Produk</h2><button id="new-product" class="button dark">+ Produk baru</button></div><form id="product-form" hidden><input type="hidden" name="id"><div class="form-grid"><label>Nama produk<input name="name" required maxlength="160"></label><label>Kategori<select name="category_id" id="product-category" required></select></label><label>Harga (angka bulat)<input name="price" type="number" min="1" step="1"></label><label>Stok<input name="stock" type="number" min="0" step="1" required value="0"></label><label class="wide">URL gambar HTTPS<input name="image_url" type="url" placeholder="https://..."></label><label class="wide">Deskripsi<textarea name="description" maxlength="3000"></textarea></label><label>Status publikasi<select name="publication_status"><option value="draft">Draft</option><option value="published">Published</option><option value="archived">Archived</option></select></label><label>Ketersediaan<select name="availability_status"><option value="available">Tersedia</option><option value="unavailable">Tidak tersedia</option></select></label></div><div class="actions"><button class="button dark">Simpan produk</button><button type="button" id="cancel-product" class="button outline">Batal</button></div><div id="product-error" aria-live="polite"></div></form><div id="admin-products" class="table-wrap"></div></section>
<section id="tab-orders" class="panel" hidden><div class="panel-title"><h2>Pesanan terbaru</h2><button id="refresh-orders" class="button outline">Refresh</button></div><div id="admin-orders" class="table-wrap"></div></section>
<section id="tab-settings" class="panel" hidden><h2>Pengaturan toko</h2><form id="settings-form" class="form-grid"><label>Nama toko<input name="store_name" maxlength="120"></label><label>Tagline<input name="tagline" maxlength="200"></label><label>Ongkir (angka bulat)<input name="shipping_fee" type="number" min="0" step="1"></label><label>WhatsApp toko<input name="whatsapp" maxlength="30"></label><label class="wide">Instruksi pembayaran<textarea name="payment_instructions" maxlength="1000"></textarea></label><div class="wide"><button class="button dark">Simpan pengaturan</button><span id="settings-result"></span></div></form></section></section></main><script src="/admin.js" defer></script></body></html>
